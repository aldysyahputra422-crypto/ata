<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Ilustrasi Raka">
  <!-- Ilustrasi profil orisinal untuk akun demo Raka: pelajar SMA berseragam putih, latar senja. Bentuk datar, tanpa gradien foto. -->
  <defs>
    <linearGradient id="langit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB07A"/><stop offset=".62" stop-color="#FF8FA6"/><stop offset="1" stop-color="#B86A9E"/>
    </linearGradient>
    <clipPath id="bingkai"><rect width="160" height="160" rx="48"/></clipPath>
  </defs>
  <g clip-path="url(#bingkai)">
    <rect width="160" height="160" fill="url(#langit)"/>
    <circle cx="118" cy="52" r="20" fill="#FFE2B8" opacity=".9"/>
    <path d="M0 118 C30 100 52 108 80 98 C108 88 132 96 160 86 V160 H0Z" fill="#7E4A78" opacity=".55"/>
    <!-- bahu & seragam putih dengan kerah -->
    <path d="M30 160 C32 128 52 116 80 116 C108 116 128 128 130 160Z" fill="#FFF8F3"/>
    <path d="M66 118 L80 136 L94 118 L88 116 L80 126 L72 116Z" fill="#E9DCD3"/>
    <path d="M74 132 L80 136 L86 132 L82 160 H78Z" fill="#8E2B2B"/>
    <!-- leher & kepala -->
    <rect x="70" y="98" width="20" height="22" rx="9" fill="#B9765A"/>
    <ellipse cx="80" cy="76" rx="27" ry="30" fill="#C98466"/>
    <ellipse cx="53" cy="80" rx="5" ry="7" fill="#B9765A"/>
    <ellipse cx="107" cy="80" rx="5" ry="7" fill="#B9765A"/>
    <!-- rambut pendek hitam dengan poni miring -->
    <path d="M52 74 C50 50 66 40 82 41 C100 42 112 54 108 74 C104 64 96 58 86 57 C76 60 64 60 56 66 Z" fill="#2A1410"/>
    <path d="M62 58 C72 50 90 48 100 56 C92 54 80 56 70 64Z" fill="#3E2119"/>
    <!-- wajah: mata, alis, senyum kecil -->
    <path d="M66 72 q5 -3 10 0" stroke="#2A1410" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M85 72 q5 -3 10 0" stroke="#2A1410" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="71" cy="80" r="2.6" fill="#2A1410"/>
    <circle cx="90" cy="80" r="2.6" fill="#2A1410"/>
    <path d="M73 93 q7 5 14 0" stroke="#7A3B2C" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <circle cx="64" cy="88" r="4" fill="#F28C7A" opacity=".45"/>
    <circle cx="97" cy="88" r="4" fill="#F28C7A" opacity=".45"/>
  </g>
</svg>
